<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Lato, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="60" y="62" font-size="28" font-weight="700" fill="#2B3A42">Schaltverlust je Schaltvorgang</text>
  <text x="60" y="92" font-size="17" fill="#6E6E6E">GaN schaltet schneller, die Verlustfl&#228;che wird deutlich kleiner</text>

  <!-- Achsen -->
  <line x1="90" y1="450" x2="850" y2="450" stroke="#B9C4CA" stroke-width="2"/>
  <line x1="90" y1="450" x2="90" y2="140" stroke="#B9C4CA" stroke-width="2"/>
  <polygon points="850,450 838,444 838,456" fill="#B9C4CA"/>
  <polygon points="90,140 84,152 96,152" fill="#B9C4CA"/>
  <text x="846" y="478" font-size="15" fill="#6E6E6E" text-anchor="end">Zeit</text>
  <text x="66" y="300" font-size="15" fill="#6E6E6E" text-anchor="middle" transform="rotate(-90 66 300)">Verlustleistung</text>

  <!-- Silizium: breite, hohe Verlustflaeche -->
  <path d="M170,450 C215,450 225,175 320,175 C415,175 425,450 470,450 Z"
        fill="#6E6E6E" fill-opacity="0.28" stroke="#6E6E6E" stroke-width="2.5"/>
  <text x="320" y="150" font-size="19" font-weight="700" fill="#4A4A4A" text-anchor="middle">Silizium</text>

  <!-- GaN: schmale, niedrige Verlustflaeche -->
  <path d="M610,450 C630,450 634,300 655,300 C676,300 680,450 700,450 Z"
        fill="#16A085" fill-opacity="0.30" stroke="#16A085" stroke-width="2.5"/>
  <text x="655" y="278" font-size="19" font-weight="700" fill="#16A085" text-anchor="middle">GaN</text>

  <!-- Breitenvergleich -->
  <line x1="170" y1="482" x2="470" y2="482" stroke="#6E6E6E" stroke-width="1.5"/>
  <line x1="170" y1="476" x2="170" y2="488" stroke="#6E6E6E" stroke-width="1.5"/>
  <line x1="470" y1="476" x2="470" y2="488" stroke="#6E6E6E" stroke-width="1.5"/>
  <text x="320" y="505" font-size="14" fill="#6E6E6E" text-anchor="middle">langsamer Schaltvorgang</text>

  <line x1="610" y1="482" x2="700" y2="482" stroke="#16A085" stroke-width="1.5"/>
  <line x1="610" y1="476" x2="610" y2="488" stroke="#16A085" stroke-width="1.5"/>
  <line x1="700" y1="476" x2="700" y2="488" stroke="#16A085" stroke-width="1.5"/>
  <text x="655" y="505" font-size="14" fill="#16A085" text-anchor="middle">schnell</text>

  <!-- Hinweis auf die Flaeche -->
  <text x="320" y="330" font-size="15" fill="#4A4A4A" text-anchor="middle">Fl&#228;che = verlorene Energie</text>

  <!-- Nutzen -->
  <text x="60" y="543" font-size="16" fill="#2B3A42">Weniger Verlust bedeutet: kleinere K&#252;hlung, kompaktere Ger&#228;te, h&#246;herer Wirkungsgrad.</text>
</svg>
